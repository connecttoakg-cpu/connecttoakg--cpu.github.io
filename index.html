}

}

  gap: 15px;

}

  background: #b98a2f;

  color: #fff;
}

  background: #d0a345;

}

  border: 1px solid white;

  color: white;
}

  background: white;

  color: #111;

}

  font-size: 42px;

  margin-top: 10px;
}

.section-heading p {
  max-width: 650px;

  margin: 15px auto;

  color: #666;
}
