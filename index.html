<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Welcome to Carryol | GI Windows & Doors</title>

<meta name="description" content="Carryol manufactures premium galvanized iron windows and doors designed for strength, security, durability and modern homes.">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth
}

body{
font-family:Arial,Helvetica,sans-serif;
color:#222;
background:#f7f7f7;
line-height:1.6
}

header{
background:#fff;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 2px 12px #0001
}

nav{
max-width:1250px;
margin:auto;
min-height:90px;
display:flex;
align-items:center;
justify-content:space-between;
padding:10px 25px
}

.logo{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center
}

.logo img{
width:210px;
height:auto;
display:block;
object-fit:contain
}

.logo-subtitle{
font-size:13px;
font-weight:600;
color:#222;
letter-spacing:1px;
margin-top:3px;
text-align:center
}

.small-title,
.product-link{
color:#b98a2f
}

nav ul{
list-style:none;
display:flex;
gap:25px;
flex-wrap:wrap;
justify-content:center;
align-items:center
}

nav a{
text-decoration:none;
color:#222;
font-weight:600
}

nav a:hover{
color:#b98a2f
}

.hero{
min-height:650px;
background:
linear-gradient(#0008,#000a),
url('https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=2000&q=85')
center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#fff;
padding:40px 20px
}

.hero h1{
font-size:clamp(45px,6vw,78px);
line-height:1.05;
margin-bottom:25px
}

.hero h1 span{
color:#d3a94e
}

.hero p{
font-size:20px;
max-width:700px;
margin:0 auto 35px
}

.hero-buttons{
display:flex;
gap:15px;
justify-content:center;
flex-wrap:wrap
}

.btn{
display:inline-block;
padding:15px 30px;
text-decoration:none;
font-weight:bold;
border-radius:3px
}

.btn-primary{
background:#b98a2f;
color:#fff
}

.btn-outline{
border:1px solid #fff;
color:#fff
}

.btn-outline:hover{
background:#fff;
color:#222
}

section{
padding:90px 20px
}

.container{
max-width:1200px;
margin:auto
}

.section-heading{
text-align:center;
margin-bottom:55px
}

.small-title{
font-weight:bold;
letter-spacing:3px;
text-transform:uppercase;
font-size:13px
}

.section-heading h2{
font-size:42px;
margin-top:10px
}

.section-heading p{
max-width:650px;
margin:15px auto;
color:#666
}

.products,
.gi-section,
.contact{
background:#fff
}

.product-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px
}

.product-card{
background:#f5f5f5;
overflow:hidden
}

.product-card img{
width:100%;
height:320px;
object-fit:cover;
display:block
}

.product-info{
padding:25px
}

.product-info h3{
font-size:23px;
margin-bottom:8px
}

.product-info p{
color:#666
}

.product-link{
display:inline-block;
margin-top:15px;
text-decoration:none;
font-weight:bold
}

.about{
background:#eee
}

.about-grid,
.contact-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:60px;
align-items:center
}

.about-image img{
width:100%;
height:500px;
object-fit:cover
}

.about-text h2{
font-size:43px;
margin:15px 0 20px
}

.about-text p{
color:#555;
margin-bottom:18px
}

.features{
background:#111;
color:#fff
}

.features .section-heading p{
color:#bbb
}

.feature-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px
}

.feature{
border:1px solid #333;
padding:35px 25px;
text-align:center
}

.feature-icon{
font-size:42px;
margin-bottom:15px
}

.feature p{
color:#aaa;
font-size:14px
}

.gi-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:25px
}

.gi-box{
padding:35px;
background:#f4f4f4;
border-left:4px solid #b98a2f
}

.gi-box p{
color:#666
}

.gallery{
background:#eee
}

.gallery-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px
}

.gallery-item{
background:#fff;
overflow:hidden;
text-align:center
}

.gallery-grid img{
width:100%;
height:270px;
object-fit:cover;
display:block;
transition:transform .3s ease
}

.gallery-item:hover img{
transform:scale(1.03)
}

.caption{
background:#fff;
padding:10px;
font-weight:bold;
font-size:16px;
color:#222
}

.cta{
background:
linear-gradient(#000b,#000b),
url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=2000&q=85')
center/cover;
color:#fff;
text-align:center
}

.cta h2{
font-size:48px;
margin-bottom:15px
}

.cta p{
max-width:650px;
margin:0 auto 30px;
color:#ddd
}

.contact-grid{
gap:50px
}

.contact-info h2{
font-size:38px;
margin:15px 0 20px
}

.contact-info>p{
color:#555;
margin-bottom:25px
}

.contact-item{
margin:22px 0
}

.contact-item strong{
display:block;
color:#b98a2f;
margin-bottom:5px
}

.contact-item a{
color:#222;
text-decoration:none
}

.contact-item a:hover{
color:#b98a2f
}

.whatsapp-contact{
display:inline-block;
background:#25d366;
color:#fff!important;
padding:11px 18px;
border-radius:4px;
font-weight:bold
}

.address{
line-height:1.7
}

form{
background:#f4f4f4;
padding:35px
}
